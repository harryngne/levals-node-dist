# Cấu hình levals-node
# Chép thành /etc/levals-node/config.yml rồi điền token giấy phép.

panel:
  url: "https://dash.levals.org"   # địa chỉ panel levals
  token: "DÁN_TOKEN_GIẤY_PHÉP"      # token do admin tạo (có thời hạn)
  node_id: 1                        # ID node trên panel

core:
  bin: "/usr/local/lib/levals-node/lvcore"   # lõi mạng (install.sh tự đặt)
  api_port: 10085                            # cổng điều khiển nội bộ (chỉ 127.0.0.1)
  assets_dir: "/usr/local/lib/levals-node/geo"

config_dir: "/etc/levals-node"      # nơi ghi core.json sinh ra + custom.json

log:
  level: "info"                     # trace|debug|info|warn|error
