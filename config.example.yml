# Cấu hình levals-node — hỗ trợ YAML và JSON (tự nhận theo đuôi file).
# Chép thành /etc/levals-node/config.yml rồi điền token giấy phép.
# Cấu trúc kiểu soga (phẳng):

server_type: "levals"               # loại panel: levals (mặc định) | xboard | v2board
api_host: "https://dash.levals.org" # địa chỉ panel
api_key: "DÁN_TOKEN"                # token node / giấy phép (api key của node)
node_id: 1                          # ID node trên panel
# node_type: "vless"               # BẮT BUỘC cho xboard/v2board:
#                                  # shadowsocks|vmess|trojan|vless|hysteria|tuic
levals_key: "GIẤY_PHÉP"            # BẮT BUỘC — giấy phép dùng phần mềm levals-node
#                                  # (KHÁC api_key: api_key là token của panel).
#                                  # Thiếu trường này node KHÔNG chạy. Node tự kiểm tra
#                                  # với hệ thống levals lúc khởi động + định kỳ;
#                                  # sai/hết hạn/bị tắt → node tự dừng.

# ── Cách viết cũ (vẫn hỗ trợ): khối panel: ──
# panel:
#   url: "https://dash.levals.org"  # (bí danh soga: api_host)
#   token: "DÁN_TOKEN"              # (bí danh soga: api_key)
#   node_id: 1
#   kind: "levals"                  # (bí danh: server_type, type)
#   node_type: "vless"

# Nhiều panel trên cùng một máy (tuỳ chọn): khai báo `panels:` THAY cho cấu hình trên.
# Mỗi panel chạy độc lập; nhớ đặt cổng node (server_port) khác nhau giữa các panel.
# panels:
#   - api_host: "https://dash.levals.org"
#     api_key: "TOKEN_PANEL_1"
#     node_id: 1
#   - api_host: "https://panel2.example.com"
#     api_key: "TOKEN_PANEL_2"
#     node_id: 2

core:
  engine: native                    # engine thuần Rust (duy nhất) — không cần lõi ngoài

config_dir: "/etc/levals-node"

log:
  level: "info"                     # trace|debug|info|warn|error

# DNS-01 (tuỳ chọn): nên đặt NGAY TRONG PANEL (ô "Nhà cung cấp DNS" + biến KEY=VALUE),
# node tự nhận. Nhà cung cấp hỗ trợ:
#   cloudflare : CF_DNS_API_TOKEN
#   dnspod     : DP_Id  +  DP_Key
#   aliyun     : Ali_Key  +  Ali_Secret
#   gcore      : GCORE_API_TOKEN
# acme:
#   dns_provider: "cloudflare"
#   cf_token: "CLOUDFLARE_API_TOKEN"
